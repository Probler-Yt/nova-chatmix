name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries, PipeWire and tools
        timeout-minutes: 10
        run: |
          sudo -E apt-get update
          sudo -E apt-get install -y --no-install-recommends -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold libegl1 libgl1 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 shellcheck pipewire pipewire-bin pipewire-pulse wireplumber pulseaudio-utils \
            libspa-0.2-modules dbus
      - name: Install Python packages
        run: pip install PySide6 numpy scipy
      - name: Byte-compile
        run: python -m py_compile src/nova-chatmix.py src/nova-chatmix-gui.py
      - name: Shellcheck
        run: shellcheck -S warning install.sh scripts/*.sh && bash -n packaging/aur/nova-chatmix.install
      - name: Tests (simulated GameDAC and KDE session, real PipeWire)
        timeout-minutes: 15
        run: python tests/run.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Package layout
        run: make install DESTDIR="$PWD/pkgroot" PREFIX=/usr && find pkgroot -type f | sort

  # When the version in src/nova-chatmix.py goes up and the tests pass, publish
  # it as a GitHub release (tag + tarball). The window's Update button and the
  # AUR package both install from these releases.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release the new version, if there is one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(make -s version)
          TAG="v$VER"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released"; exit 0
          fi
          mkdir -p dist
          git archive --format=tar.gz --prefix="nova-chatmix-$VER/" -o "dist/nova-chatmix-$VER.tar.gz" HEAD
          awk -v v="$VER" '/^## /{p=($2==v); next} p' CHANGELOG.md > dist/notes.md
          printf '\n**Update:** click *Update* in the ChatMix window, or `yay -S nova-chatmix`. Other distros: see the README.\n' >> dist/notes.md
          gh release create "$TAG" "dist/nova-chatmix-$VER.tar.gz" --target "$GITHUB_SHA" \
            --title "nova-chatmix $VER" --notes-file dist/notes.md
