name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries, PipeWire and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 shellcheck pipewire pipewire-bin pipewire-pulse wireplumber pulseaudio-utils \
            libspa-0.2-modules dbus
      - name: Install Python packages
        run: pip install PySide6 numpy scipy
      - name: Byte-compile
        run: python -m py_compile src/nova-chatmix.py src/nova-chatmix-gui.py
      - name: Shellcheck
        run: shellcheck -S warning install.sh scripts/*.sh && bash -n packaging/aur/nova-chatmix.install
      - name: Tests (simulated GameDAC and KDE session, real PipeWire)
        run: python tests/run.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Package layout
        run: make install DESTDIR="$PWD/pkgroot" PREFIX=/usr && find pkgroot -type f | sort
